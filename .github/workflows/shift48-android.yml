name: Shift48 Android APK

on:
  push:
    branches: [main, feature/shift48-v0.1]
    paths:
      - 'shift48/**'
      - '.github/workflows/shift48-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'shift48/**'
      - '.github/workflows/shift48-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shift48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4

      - name: Install Godot 4.5.2
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.5.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.2.stable" /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.5.2.stable/"

      - name: Configure Android export
        run: |
          set -e
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.0" "platforms;android-35"
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.5.tres"
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import and parse GDScript
        run: |
          godot --headless --editor --path . --quit --verbose > /tmp/import.log 2>&1 || { tail -n 150 /tmp/import.log; exit 1; }
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/import.log; then tail -n 150 /tmp/import.log; exit 1; fi

      - name: Run strategy mechanics tests
        run: |
          godot --headless --path . --script res://tests/smoke.gd > /tmp/test.log 2>&1 || { cat /tmp/test.log; exit 1; }
          cat /tmp/test.log
          grep -q 'PASS: Shift48' /tmp/test.log

      - name: Run UI smoke test
        run: |
          godot --headless --path . --quit-after 12 > /tmp/runtime.log 2>&1 || { cat /tmp/runtime.log; exit 1; }
          if grep -E 'SCRIPT ERROR|Invalid call|Parse Error' /tmp/runtime.log; then cat /tmp/runtime.log; exit 1; fi

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/Shift48-v0.1-debug.apk
          test -s build/Shift48-v0.1-debug.apk
          sha256sum build/Shift48-v0.1-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Shift48-v0.1-Android
          path: shift48/build/Shift48-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
