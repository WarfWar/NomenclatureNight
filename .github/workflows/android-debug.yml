name: Android APK (debug)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.5.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.2.stable" /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.5.2.stable/"
          godot --version
      - name: Set up debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Import project and check scripts
        run: |
          godot --headless --editor --path . --quit --verbose > /tmp/import.log 2>&1 || { tail -n 150 /tmp/import.log; exit 1; }
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/import.log; then exit 1; fi
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/NomenclatureNight-debug.apk
          test -s build/NomenclatureNight-debug.apk
          sha256sum build/NomenclatureNight-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NomenclatureNight-v0.3-Android-arm64
          path: build/NomenclatureNight-debug.apk
          if-no-files-found: error
          retention-days: 30
