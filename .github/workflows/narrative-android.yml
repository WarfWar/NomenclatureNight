name: Narrative Quest Android APK
on:
  push:
    branches: [main, feature/text-quest-v0.4]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Godot
        run: |
          set -euo pipefail
          V=4.5.2
          BASE="https://github.com/godotengine/godot/releases/download/${V}-stable"
          curl -fL --retry 3 "$BASE/Godot_v${V}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v${V}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v${V}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${V}.stable" /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${V}.stable/"
      - name: Android paths and debug signing
        run: |
          set -e
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.0" "platforms;android-35"
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.5.tres"
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"
      - name: Validate story graph
        run: python3 tests/check_story.py
      - name: Import and parse
        run: |
          godot --headless --editor --path . --quit --verbose > /tmp/import.log 2>&1 || { tail -n 150 /tmp/import.log; exit 1; }
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/import.log; then exit 1; fi
      - name: Runtime smoke test
        run: |
          godot --headless --path . --quit-after 10 > /tmp/runtime.log 2>&1 || { cat /tmp/runtime.log; exit 1; }
          if grep -E 'SCRIPT ERROR|Invalid call|Parse Error' /tmp/runtime.log; then exit 1; fi
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/NomenclatureNight-v0.4-debug.apk
          test -s build/NomenclatureNight-v0.4-debug.apk
          sha256sum build/NomenclatureNight-v0.4-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NomenclatureNight-v0.4-narrative-Android
          path: build/NomenclatureNight-v0.4-debug.apk
          if-no-files-found: error
          retention-days: 30
